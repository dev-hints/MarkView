[package]
name = "markview"
version = "0.1.0"
description = "Professional Cross-Platform Markdown Desktop Application"
authors = ["Ayush"]
edition = "2021"

[lib]
name = "markview_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.5"
regex = "1.10"
notify = "6.1"
notify-debouncer-mini = "0.4"
tokio = { version = "1.38", features = ["sync", "rt", "time"] }
thiserror = "1.0"
